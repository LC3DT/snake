# ============================================================================
#  🐍 Snake Frontend (TypeScript + Vite) — Nginx Configuration
#  功能：
#    1. 托管 Vite 构建产物（client/dist/）
#    2. 反向代理 /api/* 请求到后端容器，消除跨域问题
# ============================================================================
server {
    listen       80;
    server_name  localhost;

    # ---- 字符集 ----
    charset utf-8;

    # ---- 静态文件根目录（Vite 构建输出） ----
    root /usr/share/nginx/html;

    # ---- MIME 类型 ----
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- 日志 ----
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # ================================================================
    #  反向代理：将所有 /api/ 开头的请求转发到后端服务
    #
    #  在 Docker Compose 中，后端 hostname = "backend"
    #  在 Kubernetes 中，Service 名称也设为 "backend"
    #  因此同一份 nginx.conf 可以在两种环境下复用。
    # ================================================================
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $scheme;
        proxy_connect_timeout   5s;
        proxy_send_timeout      10s;
        proxy_read_timeout      10s;

        # Vite 构建产物的哈希文件名有长期缓存，但不缓存 API 响应
        add_header Cache-Control "no-store" always;
    }

    # ================================================================
    #  静态文件托管
    #
    #  Vite 构建产出带有哈希的文件名（如 index.abc123.js），适合长期缓存。
    #  SPA fallback：未匹配到文件时返回 index.html（支持客户端路由）。
    # ================================================================
    location / {
        try_files $uri $uri/ /index.html;

        # 对带有哈希的静态资源启用强缓存（Vite 默认文件名哈希）
        location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---- 安全头 ----
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header X-Content-Type-Options  "nosniff"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
}
