<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <title>🐍 贪吃蛇 Snake</title>
</head>
<body>
  <div id="game-wrapper">
    <!-- ====== 顶部面板 ====== -->
    <div id="score-panel">
      <div class="score-item">
        <span class="score-label">SCORE</span>
        <span class="score-value" id="current-score">000</span>
      </div>
      <div class="score-divider"></div>
      <div class="score-item">
        <span class="score-label">HIGH</span>
        <span class="score-value high" id="high-score">000</span>
      </div>
      <div class="score-divider"></div>
      <div class="score-item">
        <span class="score-label">SPEED</span>
        <span class="score-value speed" id="speed-level">Lv.0</span>
      </div>
      <div class="score-divider"></div>
      <div class="score-item">
        <span class="score-label">MODE</span>
        <span class="score-value ai-mode" id="ai-status">👤 手动</span>
      </div>
      <div class="score-divider"></div>
      <div class="score-item toggle-item">
        <span class="score-label">穿墙</span>
        <label class="toggle-switch">
          <input type="checkbox" id="wrap-toggle" />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- ====== 游戏区域 ====== -->
    <div id="play-area">
      <div id="canvas-container">
        <!-- 道具图例 -->
        <div id="item-legend" class="legend">
          <span class="legend-dot" style="background:#ff0044;"></span> +10
          <span class="legend-dot" style="background:#ffd700;"></span> +50⭐
          <span class="legend-dot" style="background:#00bfff;"></span> 🐢
          <span class="legend-dot" style="background:#bf00ff;"></span> 🌀
          <span class="legend-dot" style="background:#00ff88;"></span> 🛡️
          <span class="legend-dot" style="background:#aa88ff;"></span> 👻
        </div>

        <!-- 效果状态面板（右上角） -->
        <div id="effects-panel" class="effects-panel hidden"></div>

        <!-- 开始覆盖层 -->
        <div id="start-overlay" class="overlay">
          <div class="overlay-content">
            <div class="snake-icon">🐍</div>
            <h1 class="game-title">贪吃蛇</h1>
            <p class="start-hint">按 <kbd>空格</kbd> 或点击开始</p>
            <p class="start-subtitle"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 滑动控制方向</p>
            <div class="overlay-items">
              <div class="item-card">
                <span class="item-icon" style="color:#ff0044">🍎</span>
                <span class="item-desc">+10</span>
              </div>
              <div class="item-card">
                <span class="item-icon" style="color:#ffd700">⭐</span>
                <span class="item-desc">+50</span>
              </div>
              <div class="item-card">
                <span class="item-icon" style="color:#00bfff">💧</span>
                <span class="item-desc">减速</span>
              </div>
              <div class="item-card">
                <span class="item-icon" style="color:#bf00ff">☠️</span>
                <span class="item-desc">反转</span>
              </div>
              <div class="item-card">
                <span class="item-icon" style="color:#00ff88">🛡️</span>
                <span class="item-desc">护盾</span>
              </div>
              <div class="item-card">
                <span class="item-icon" style="color:#aa88ff">👻</span>
                <span class="item-desc">幽灵</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 暂停覆盖层 -->
        <div id="pause-overlay" class="overlay hidden">
          <div class="overlay-content">
            <h2>⏸ 暂停</h2>
            <p>按 <kbd>P</kbd> 或 <kbd>Esc</kbd> 继续</p>
          </div>
        </div>

        <!-- 游戏结束覆盖层 -->
        <div id="gameover-overlay" class="overlay hidden">
          <div class="overlay-content gameover-panel">
            <h2>💀 游戏结束</h2>
            <div class="final-score">
              <span class="final-label">最终得分</span>
              <span id="final-score-value" class="final-value">0</span>
            </div>
            <div id="new-record-badge" class="new-record hidden">🏆 新纪录！</div>

            <!-- 分数提交区域 -->
            <div id="score-submit-area" class="score-submit-area hidden">
              <div class="submit-row">
                <input type="text" id="player-name-input"
                       class="name-input" placeholder="输入名称"
                       maxlength="10" autocomplete="off" />
                <button id="submit-score-btn" class="neon-btn submit-btn">提交</button>
              </div>
              <p class="submit-hint">3-10 位字母、数字或下划线</p>
            </div>
            <div id="submit-success" class="submit-success hidden">✅ 提交成功！</div>

            <p class="restart-hint">按 <kbd>空格</kbd> 重新开始</p>
          </div>
        </div>

        <!-- Canvas -->
        <canvas id="game-canvas"></canvas>
      </div>

      <!-- ====== 排行榜面板 ====== -->
      <div id="leaderboard-panel" class="leaderboard-panel">
        <div class="leaderboard-header">
          <span class="leaderboard-title">🏆 排行榜</span>
          <button id="refresh-leaderboard-btn" class="neon-btn refresh-btn" title="刷新">⟳</button>
        </div>
        <div id="leaderboard-body" class="leaderboard-body">
          <div class="leaderboard-loading">加载中...</div>
        </div>
      </div>
    </div>

    <!-- 触控操作提示（仅移动端可见） -->
    <p id="touch-hint" class="touch-hint">← 滑动操作 →</p>
  </div>

  <!-- 使用 Vite 的模块入口 -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
