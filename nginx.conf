# ============================================================================
#  🐍 Snake Frontend — Nginx Configuration
#  功能：
#    1. 托管前端静态文件（HTML / CSS / JS）
#    2. 反向代理 /api/* 请求到后端容器，消除跨域问题
# ============================================================================
server {
    listen       80;
    server_name  localhost;

    # ---- 字符集 ----
    charset utf-8;

    # ---- 静态文件根目录 ----
    root /usr/share/nginx/html;

    # ---- MIME 类型 ----
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- 日志 ----
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- Gzip 压缩（提升前端加载速度） ----
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # ================================================================
    #  反向代理：将所有 /api/ 开头的请求转发到后端服务
    #
    #  在 Docker Compose 中，后端 hostname = "backend"
    #  在 Kubernetes 中，Service 名称也设为 "backend"
    #  因此同一份 nginx.conf 可以在两种环境下复用。
    #
    #  路由逻辑：
    #    浏览器请求 /api/leaderboard
    #    → Nginx 匹配 location /api/
    #    → 转发到 http://backend:3001/api/leaderboard
    #    → 后端处理返回 JSON
    #    → Nginx 返回给浏览器
    #
    #  优点：浏览器只和 Nginx（同源 80 端口）通信，无需 CORS。
    # ================================================================
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        # 传递原始请求头
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $scheme;

        # 超时设置
        proxy_connect_timeout   5s;
        proxy_send_timeout      10s;
        proxy_read_timeout      10s;
    }

    # ================================================================
    #  静态文件托管
    #
    #  路由逻辑：
    #    浏览器请求 /                        → 返回 index.html（SPA 入口）
    #    浏览器请求 /style.css               → 返回静态文件
    #    浏览器请求 /game.js                 → 返回静态文件
    #    未匹配到文件（如 /some/unknown/url） → 也返回 index.html（SPA fallback）
    # ================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 安全头 ----
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header X-Content-Type-Options  "nosniff"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
}
